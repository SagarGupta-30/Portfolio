<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#050816"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#sgGradient)" stroke-width="2" opacity="0.6"/>
  <text x="50" y="65" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="44" fill="url(#sgGradient)" text-anchor="middle" filter="url(#glow)">SG</text>
</svg>
